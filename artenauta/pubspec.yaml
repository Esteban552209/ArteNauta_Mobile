name: artenauta
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:   
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/LOGO.png
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 